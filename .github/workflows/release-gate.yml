name: Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'release/**'
      - 'hotfix/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler-gate:
    name: Release / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-2.111.0
          - dmd-2.112.1
          - dmd-2.113.0
          - ldc-1.41.0
          - ldc-1.42.0
          - ldc-1.43.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
          dub: 1.40.0
      - name: Compiler versions
        run: |
          "$DC" --version
          dub --version
      - name: Metadata check
        run: |
          test -s LICENSE
          test -s CHANGELOG.md
          grep -q '^license "MIT"' dub.sdl
          grep -q '^name "fuzzy-d"' dub.sdl
      - name: Unit tests
        run: dub test --compiler="$DC" --force
      - name: External consumer smoke
        run: dub run --root=tests/consumer --compiler="$DC" --force
      - name: Release build
        run: dub build --build=release --compiler="$DC" --force
      - name: Representative benchmarks
        run: dub run --root=benchmarks --build=release --compiler="$DC" --force
      - name: Ddoc build
        if: startsWith(matrix.compiler, 'dmd-')
        run: dub build --build=docs --compiler="$DC" --force
